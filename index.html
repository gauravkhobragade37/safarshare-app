<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafarShare - Smart Ride & Logistics</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    /* Safar AI Floating Widget Styles */
    #safar-ai-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99999;
    }
    #safar-ai-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    #safar-ai-btn:hover { transform: scale(1.05); }
    #safar-ai-box {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 320px;
      height: 430px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      z-index: 99999;
    }
    #safar-ai-box.hidden { display: none; }
    .ai-header {
      background: #1e40af;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .ai-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; line-height: 1.4; }
    .ai-msg.bot { background: #f1f5f9; color: #1e293b; align-self: flex-start; }
    .ai-msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .ai-input-bar { display: flex; border-top: 1px solid #e2e8f0; background: #fff; }
    .ai-input-bar input { flex: 1; border: none; padding: 12px; font-size: 13px; outline: none; }
    .ai-input-bar button { background: #2563eb; color: #fff; border: none; padding: 0 16px; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased pb-24">

  <!-- TOP HEADER -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-car text-xl"></i>
        <span class="text-xl font-bold tracking-tight">SafarShare</span>
      </div>
      <div id="auth-container" class="flex items-center space-x-2">
        <button id="login-btn" onclick="loginWithGoogle()" class="bg-white text-blue-600 text-xs px-3 py-1.5 rounded-lg font-bold shadow hover:bg-gray-100 flex items-center gap-1.5">
          <i class="fa-brands fa-google"></i> Login
        </button>
        <div id="user-profile" class="hidden flex items-center space-x-2">
          <span id="user-name" class="text-xs bg-blue-700 px-2.5 py-1 rounded-md font-semibold border border-blue-400 truncate max-w-[120px]">User</span>
          <button onclick="logoutUser()" class="text-xs text-blue-200 hover:text-white underline"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <div class="max-w-4xl mx-auto px-4 mt-3">
    <div class="flex bg-white rounded-xl shadow-sm p-1 border border-gray-200 text-sm font-medium">
      <button onclick="switchTab('find')" id="tab-find" class="flex-1 py-2 rounded-lg text-center bg-blue-600 text-white shadow transition-all">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Find Ride
      </button>
      <button onclick="switchTab('post')" id="tab-post" class="flex-1 py-2 rounded-lg text-center text-gray-600 hover:text-blue-600 transition-all">
        <i class="fa-solid fa-plus-circle mr-1"></i> Post Trip
      </button>
      <button onclick="switchTab('my')" id="tab-my" class="flex-1 py-2 rounded-lg text-center text-gray-600 hover:text-blue-600 transition-all">
        <i class="fa-solid fa-list-check mr-1"></i> My Trips
      </button>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-4 mt-4">

    <!-- FIND RIDE SECTION -->
    <section id="section-find" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-gray-700 flex items-center"><i class="fa-solid fa-filter text-blue-500 mr-2"></i> Search Available Rides</h3>
          <a href="https://wa.me/918668828542?text=Hi%20Gaurav%2C%20I%20need%20help%20with%20SafarShare" target="_blank" class="bg-green-100 text-green-700 hover:bg-green-200 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1">
            <i class="fa-brands fa-whatsapp"></i> Live Support
          </a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="text-xs font-semibold text-gray-500">From</label>
            <input type="text" id="find-from" placeholder="e.g. Balaghat" class="w-full mt-1 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">To</label>
            <input type="text" id="find-to" placeholder="e.g. Nagpur" class="w-full mt-1 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>
        <button onclick="searchRides()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition">
          Search Rides
        </button>
      </div>

      <!-- RIDES RESULTS CONTAINER -->
      <div id="rides-list" class="space-y-3">
        <!-- Dynamic Cards Load Here -->
      </div>
    </section>

    <!-- POST TRIP SECTION -->
    <section id="section-post" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
        <h3 class="font-bold text-gray-700 mb-4 flex items-center"><i class="fa-solid fa-route text-blue-500 mr-2"></i> Create a New Route</h3>
        
        <form id="post-trip-form" onsubmit="handlePostTrip(event)" class="space-y-3">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-500">Origin (From) *</label>
              <input type="text" id="post-from" required placeholder="Balaghat" class="w-full mt-1 border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Destination (To) *</label>
              <input type="text" id="post-to" required placeholder="Nagpur" class="w-full mt-1 border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <div>
              <label class="text-xs font-semibold text-gray-500">Travel Date *</label>
              <input type="date" id="post-date" required class="w-full mt-1 border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Available Seats *</label>
              <input type="number" id="post-seats" min="1" max="50" value="3" required class="w-full mt-1 border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="col-span-2 md:col-span-1">
              <label class="text-xs font-semibold text-gray-500">Fare per Seat (₹) *</label>
              <input type="number" id="post-fare" min="0" placeholder="250" required class="w-full mt-1 border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-500">Vehicle Type</label>
            <select id="post-vehicle" class="w-full mt-1 border rounded-lg p-2 text-sm outline-none bg-white">
              <option value="Car">Car</option>
              <option value="Bike">Bike</option>
              <option value="Bus">Bus</option>
              <option value="Auto">Auto/Cab</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg shadow mt-2 transition">
            Confirm & Post Trip
          </button>
        </form>
      </div>
    </section>

    <!-- MY TRIPS SECTION -->
    <section id="section-my" class="hidden space-y-4">
      <div id="my-trips-list" class="space-y-3">
        <!-- Dynamic Cards for User's Trips Load Here -->
      </div>
    </section>

  </main>

  <!-- FLOATING AI CHAT WIDGET -->
  <div id="safar-ai-widget">
    <button id="safar-ai-btn" onclick="toggleAIChat()">
      <i class="fa-solid fa-robot text-lg"></i>
      <span>Chat with Safar AI</span>
    </button>

    <div id="safar-ai-box" class="hidden">
      <div class="ai-header">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-robot"></i>
          <span>Safar AI Support</span>
        </div>
        <button onclick="toggleAIChat()" class="text-white hover:text-gray-200 text-base">✕</button>
      </div>
      <div id="ai-chat-messages" class="ai-messages">
        <div class="ai-msg bot">नमस्ते! मैं SafarShare AI हूँ। राइड बुक करने, ट्रिप पोस्ट करने या किसी भी सहायता के लिए मुझसे पूछें।</div>
      </div>
      <div class="ai-input-bar">
        <input type="text" id="ai-user-input" placeholder="Type your query..." onkeypress="if(event.key==='Enter') sendAIMessage()">
        <button onclick="sendAIMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDexampleOnlyKeyReplaceIfNeed",
      authDomain: "safarshare-7fc91.firebaseapp.com",
      projectId: "safarshare-7fc91",
      storageBucket: "safarshare-7fc91.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    const MASTER_ADMIN_EMAIL = "gauravkhobragade37@gmail.com";
    const WHATSAPP_SUPPORT_NUM = "8668828542";
    let currentUser = null;

    // --- AUTHENTICATION STATE OBSERVER ---
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = {
          uid: user.uid,
          name: user.displayName || "User",
          email: user.email,
          isAdmin: user.email === MASTER_ADMIN_EMAIL
        };
        document.getElementById("login-btn").classList.add("hidden");
        document.getElementById("user-profile").classList.remove("hidden");
        document.getElementById("user-name").textContent = currentUser.isAdmin ? "Master Admin" : currentUser.name.split(" ")[0];
      } else {
        currentUser = null;
        document.getElementById("login-btn").classList.remove("hidden");
        document.getElementById("user-profile").classList.add("hidden");
      }
      searchRides();
      loadMyTrips();
    });

    function loginWithGoogle() {
      auth.signInWithPopup(provider).catch(err => alert("Login Failed: " + err.message));
    }

    function logoutUser() {
      auth.signOut();
    }

    // --- TABS CONTROLLER ---
    function switchTab(tab) {
      ['find', 'post', 'my'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'flex-1 py-2 rounded-lg text-center text-gray-600 hover:text-blue-600 transition-all';
      });
      document.getElementById(`section-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-2 rounded-lg text-center bg-blue-600 text-white shadow transition-all';

      if (tab === 'my') loadMyTrips();
    }

    // --- REALTIME FIRESTORE LISTENER & SEARCH ---
    function searchRides() {
      const fromQuery = document.getElementById("find-from").value.trim().toLowerCase();
      const toQuery = document.getElementById("find-to").value.trim().toLowerCase();
      const list = document.getElementById("rides-list");

      db.collection("trips").where("status", "==", "Active").onSnapshot(snapshot => {
        list.innerHTML = "";
        let trips = [];
        snapshot.forEach(doc => trips.push({ id: doc.id, ...doc.data() }));

        const filtered = trips.filter(t => {
          const matchFrom = fromQuery ? t.from.toLowerCase().includes(fromQuery) : true;
          const matchTo = toQuery ? t.to.toLowerCase().includes(toQuery) : true;
          return matchFrom && matchTo;
        });

        if (filtered.length === 0) {
          list.innerHTML = `<div class="bg-white p-6 rounded-xl border text-center text-gray-500 font-medium">No rides found. Try changing routes or post a trip!</div>`;
          return;
        }

        filtered.forEach(trip => {
          const isOwner = currentUser && trip.driverUid === currentUser.uid;
          list.innerHTML += `
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-base text-gray-800">${trip.from} ➔ ${trip.to}</span>
                  <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">${trip.vehicle}</span>
                </div>
                <div class="text-xs text-gray-500 mt-1 space-x-3">
                  <span><i class="fa-regular fa-calendar"></i> ${trip.date}</span>
                  <span><i class="fa-solid fa-chair"></i> ${trip.seats} Seats left</span>
                  <span><i class="fa-solid fa-user"></i> ${trip.driverName}</span>
                </div>
              </div>
              <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-end">
                <span class="text-lg font-bold text-green-600">₹${trip.fare}</span>
                <button onclick="shareTripOnWhatsApp('${trip.id}', '${trip.from}', '${trip.to}', '${trip.date}', ${trip.seats}, ${trip.fare})" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1 shadow">
                  <i class="fa-brands fa-whatsapp text-sm"></i> Share
                </button>
                ${!isOwner ? `
                  <button onclick="bookRide('${trip.id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-bold shadow">
                    Book Seat
                  </button>
                ` : `<span class="text-xs bg-gray-100 text-gray-600 px-3 py-2 rounded-lg font-semibold">Your Trip</span>`}
              </div>
            </div>
          `;
        });
      });
    }

    // --- POST TRIP FUNCTION ---
    function handlePostTrip(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("Please login first to post a trip.");
        loginWithGoogle();
        return;
      }

      const newTrip = {
        from: document.getElementById("post-from").value.trim(),
        to: document.getElementById("post-to").value.trim(),
        date: document.getElementById("post-date").value,
        seats: parseInt(document.getElementById("post-seats").value),
        fare: parseInt(document.getElementById("post-fare").value),
        vehicle: document.getElementById("post-vehicle").value,
        driverUid: currentUser.uid,
        driverName: currentUser.name,
        driverEmail: currentUser.email,
        status: "Active",
        createdAt: new Date().toISOString()
      };

      db.collection("trips").add(newTrip).then(() => {
        alert("Trip posted successfully!");
        document.getElementById("post-trip-form").reset();
        switchTab("my");
      }).catch(err => alert("Error: " + err.message));
    }

    // --- LOAD MY TRIPS ---
    function loadMyTrips() {
      const container = document.getElementById("my-trips-list");
      if (!currentUser) {
        container.innerHTML = `<div class="bg-white p-6 rounded-xl border text-center text-gray-500">Please login to view your trips.</div>`;
        return;
      }

      db.collection("trips").where("driverUid", "==", currentUser.uid).onSnapshot(snapshot => {
        container.innerHTML = "";
        if (snapshot.empty) {
          container.innerHTML = `<div class="bg-white p-6 rounded-xl border text-center text-gray-500">You haven't posted any trips yet.</div>`;
          return;
        }

        snapshot.forEach(doc => {
          const trip = doc.data();
          container.innerHTML += `
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
              <div>
                <h4 class="font-bold text-gray-800">${trip.from} ➔ ${trip.to}</h4>
                <p class="text-xs text-gray-500 mt-1">${trip.date} • ${trip.seats} Seats • ₹${trip.fare}</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="shareTripOnWhatsApp('${doc.id}', '${trip.from}', '${trip.to}', '${trip.date}', ${trip.seats}, ${trip.fare})" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 shadow">
                  <i class="fa-brands fa-whatsapp"></i> Share
                </button>
                <button onclick="cancelTrip('${doc.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-3 py-1.5 rounded-lg font-bold border border-red-200">
                  Cancel
                </button>
              </div>
            </div>
          `;
        });
      });
    }

    // --- BOOK RIDE ---
    function bookRide(tripId) {
      if (!currentUser) {
        alert("Please login first to book a seat.");
        loginWithGoogle();
        return;
      }
      alert("Booking Request Sent to Driver! They will contact you shortly.");
    }

    // --- CANCEL TRIP ---
    function cancelTrip(tripId) {
      if (confirm("Are you sure you want to cancel this trip?")) {
        db.collection("trips").doc(tripId).update({ status: "Cancelled" });
      }
    }

    // --- WHATSAPP SMART SHARE (DEEP-LINKING) ---
    function shareTripOnWhatsApp(tripId, from, to, date, seats, fare) {
      const currentUrl = window.location.origin + window.location.pathname;
      const tripBookingUrl = `${currentUrl}?tripId=${tripId}`;
      
      const message = `🚗 *SafarShare Trip Update!*\n📍 *Route:* ${from} ➔ ${to}\n📅 *Date:* ${date}\n💺 *Available Seats:* ${seats}\n💰 *Fare:* ₹${fare}\n\n👉 *Book Seat Directly Here:* \n${tripBookingUrl}`;
      
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
      window.open(waUrl, "_blank");
    }

    // --- CHECK DIRECT LINK FROM WHATSAPP ON LOAD ---
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const directTripId = params.get("tripId");
      if (directTripId) {
        db.collection("trips").doc(directTripId).get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            document.getElementById("find-from").value = data.from;
            document.getElementById("find-to").value = data.to;
            searchRides();
          }
        });
      }
    });

    // --- IN-APP AI SUPPORT CHAT LOGIC ---
    function toggleAIChat() {
      document.getElementById("safar-ai-box").classList.toggle("hidden");
    }

    function sendAIMessage() {
      const input = document.getElementById("ai-user-input");
      const msgText = input.value.trim();
      if (!msgText) return;

      const chat = document.getElementById("ai-chat-messages");
      chat.innerHTML += `<div class="ai-msg user">${msgText}</div>`;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      setTimeout(() => {
        let botReply = "नमस्ते! मैं SafarShare AI हूँ। आप ऊपर 'Find Ride' से राइड खोज सकते हैं या 'Post Trip' से अपनी गाड़ी शेयर कर सकते हैं।";
        const q = msgText.toLowerCase();

        if (q.includes("book") || q.includes("सर्च") || q.includes("ride")) {
          botReply = "राइड बुक करने के लिए 'Find Ride' टैब में जाकर फ्रॉम और टू शहर सर्च करें, फिर 'Book Seat' पर क्लिक करें।";
        } else if (q.includes("post") || q.includes("driver") || q.includes("गाड़ी")) {
          botReply = "'Post Trip' टैब में जाकर अपना रूट, तारीख, खाली सीटें और किराया डालकर अपनी राइड लिस्ट करें।";
        } else if (q.includes("cancel") || q.includes("रद्द")) {
          botReply = "'My Trips' सेक्शन में जाकर आप कभी भी अपनी ट्रिप कैंसिल कर सकते हैं।";
        } else if (q.includes("payment") || q.includes("पैसा") || q.includes("fare")) {
          botReply = "किराया सीधे यात्रा के समय ड्राइवर को UPI या नकद (Cash) के माध्यम से दिया जा सकता है।";
        } else if (q.includes("contact") || q.includes("help") || q.includes("admin") || q.includes("whatsapp")) {
          botReply = `आप सीधे Master Admin गौरव से WhatsApp पर संपर्क कर सकते हैं: <a href="https://wa.me/91${WHATSAPP_SUPPORT_NUM}" target="_blank" class="text-blue-600 underline font-bold">यहाँ क्लिक करें</a>`;
        }

        chat.innerHTML += `<div class="ai-msg bot">${botReply}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 400);
    }
  </script>
</body>
</html>
